services:
 # Database
 db:
   image: postgres:15-alpine
   container_name: deficopilot_db
   restart: always
   environment:
     POSTGRES_USER: admin
     POSTGRES_PASSWORD: ${DB_PASSWORD}
     POSTGRES_DB: deficopilot_db
   ports:
     - "5432:5432"
   volumes:
     - pgdata:/var/lib/postgresql/data
   healthcheck:
     test: ["CMD-SHELL", "pg_isready -U admin -d deficopilot_db"]
     interval: 5s
     timeout: 3s
     retries: 12
     start_period: 5s

 # Backend
 backend:
   build:
     context: ./backend
     dockerfile: Dockerfile
   container_name: deficopilot_backend
   restart: always
   ports:
     - "8080:8080"
   environment:
    # Ket noi database
     - DB_HOST=db
     - DB_PORT=5432
     - DB_USER=admin
     - DB_PASSWORD=${DB_PASSWORD}
     - DB_NAME=deficopilot_db
     - DB_SSLMODE=${DB_SSLMODE:-disable}
    # Ket noi AI
     - AI_PROVIDER=${AI_PROVIDER:-mock}
     - OPENAI_API_KEY=${OPENAI_API_KEY:-}
     - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
     - GEMINI_API_KEY=${GEMINI_API_KEY:-}
     - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3-flash-preview}
    # Ket noi Avalanche
     - DATA_MODE=${DATA_MODE:-mock}
     - AVALANCHE_RPC_URL=${AVALANCHE_RPC_URL}
     - SNOWTRACE_API_KEY=${SNOWTRACE_API_KEY}
     - AGENT_PRIVATE_KEY=${AGENT_PRIVATE_KEY}
     - AVALANCHE_DATA_API_KEY=${AVALANCHE_DATA_API_KEY:-}
   depends_on:
     - db
   stop_grace_period: 45s

 # Frontend
 frontend:
   build:
     context: ./frontend
     dockerfile: Dockerfile
   container_name: deficopilot_frontend
   restart: always
   ports:
     - "3000:3000"
   environment:
     - VITE_API_URL=http://localhost:8080
     - VITE_PRIVY_APP_ID=${VITE_PRIVY_APP_ID}
   depends_on:
     - backend

 # Database migrations
 migrate:
   image: migrate/migrate:v4.18.3
   profiles: ["tools"]
   restart: "no"
   environment:
     PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
   volumes:
     - ./backend/migrations:/migrations:ro
   entrypoint:
     - migrate
     - -path
     - /migrations
     - -database
     - postgres://admin@db:5432/deficopilot_db?sslmode=disable
   command: ["up"]
   depends_on:
     db:
       condition: service_healthy

# Khai bao volumes
volumes: 
  pgdata:
